
<h2>Welcome to the Mitchell Brothers Car Showroom stock system</h2>
<h2>Add a new car to our sales fleet</h2>
<p>We current have <strong>{{ carServ.All().length}}</strong> cars.</p>

<form [formGroup]="carForm" (ngSubmit)="onSubmit()">

  <label>Car Name:</label>

  <input formControlName="name">

  <label>Image Path:</label>

  <input formControlName="image">


  <button type="submit">
    Create Car 
  </button>
  <button routerLink="/list">List</button>
    
</form>
